name: Teste de ponta a ponta (Windows real)

# Disparo manual. Instala o WireSock de verdade no executor do GitHub e roda o fluxo real
# do VoltaGoLive contra um servidor WireGuard local. Não usa segredos nem conta Proton.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: WireSock real, túnel local
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rodar o teste de ponta a ponta
        shell: powershell
        run: ./tools/Invoke-EndToEndTest.ps1
