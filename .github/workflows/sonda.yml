name: Sonda temporária do WireSock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Sondar os dois pacotes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          function Show-Run {
              param([string]$Exe, [string[]]$Arguments = @())
              Write-Output ''
              Write-Output ('>>> ' + (Split-Path $Exe -Leaf) + ' ' + ($Arguments -join ' '))
              $out = Join-Path $env:RUNNER_TEMP 'o.txt'; $err = Join-Path $env:RUNNER_TEMP 'e.txt'
              $params = @{ FilePath = $Exe; RedirectStandardOutput = $out; RedirectStandardError = $err; PassThru = $true; WindowStyle = 'Hidden' }
              if ($Arguments.Count -gt 0) { $params.ArgumentList = $Arguments }
              $p = Start-Process @params
              if (-not $p.WaitForExit(20000)) { Stop-Process -Id $p.Id -Force; Write-Output '(encerrado apos 20s)' } else { Write-Output ('(codigo de saida ' + $p.ExitCode + ')') }
              Get-Content $out, $err -ErrorAction SilentlyContinue | Select-Object -First 70 | ForEach-Object { Write-Output ('  ' + $_) }
          }
          function Show-Signature {
              param([string]$Path)
              $s = Get-AuthenticodeSignature -LiteralPath $Path
              Write-Output ('Assinatura de ' + (Split-Path $Path -Leaf) + ': ' + $s.Status + ' | ' + $s.SignerCertificate.Subject + ' | versao ' + (Get-Item $Path).VersionInfo.FileVersion)
          }
          Write-Output '######## Pacote NTKERNEL.WireSockVPNClient'
          winget install --id NTKERNEL.WireSockVPNClient --exact --source winget --silent --accept-package-agreements --accept-source-agreements | Select-Object -Last 2
          $cli = Join-Path $env:ProgramFiles 'WireSock Secure Connect\command-line\wiresock-connect-cli.exe'
          Show-Signature $cli
          Show-Signature (Join-Path $env:ProgramFiles 'WireSock Secure Connect\service\wiresock-connect-service.exe')
          Show-Run $cli
          Show-Run $cli @('--help')
          foreach ($sub in 'connect', 'disconnect', 'import', 'export', 'status', 'list', 'run', 'delete') { Show-Run $cli @($sub, '--help') }
          Write-Output ''
          Write-Output '######## Pacote NTKERNEL.WireSockVPNClientCLI'
          winget install --id NTKERNEL.WireSockVPNClientCLI --exact --source winget --silent --accept-package-agreements --accept-source-agreements | Select-Object -Last 2
          Get-ChildItem $env:ProgramFiles, ${env:ProgramFiles(x86)} -Directory -Filter 'WireSock*' | ForEach-Object {
              Write-Output ('Pasta: ' + $_.FullName)
              Get-ChildItem $_.FullName -Recurse -File -Include '*.exe', '*.sys' | ForEach-Object { Write-Output ('  ' + $_.FullName) }
          }
          Get-Service -Name '*wiresock*' -ErrorAction SilentlyContinue | ForEach-Object { Write-Output ('Servico: ' + $_.Name + ' ' + $_.Status) }
          $client = Get-ChildItem $env:ProgramFiles, ${env:ProgramFiles(x86)} -Recurse -File -Filter 'wiresock-client.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($client) {
              Show-Signature $client.FullName
              Show-Run $client.FullName
              Show-Run $client.FullName @('run', '--help')
          } else { Write-Output 'wiresock-client.exe NAO encontrado' }
